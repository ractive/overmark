<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI</title>
<style>
	body { margin: 40px; font: 20px sans-serif; }
	#label, #other { width: 300px; height: 80px; margin: 10px 0; background: #eee; }
	#menu { list-style: none; margin: 0; padding: 0; width: 300px; background: rgb(0, 120, 255); color: #fff; }
	#menu li { padding: 20px; }
	input { display: block; margin: 10px 0; padding: 4px; border: 0; background: #fff; font: 700 48px monospace; }
	#plain { color: rgb(0, 160, 0); transition: all 2s; }
	#secret { color: rgb(200, 0, 160); }
	.hidden { display: none; }
	dialog { width: 400px; height: 200px; }
</style>
</head>
<body>
<div id="label">A label</div>
<div id="other">Something else</div>
<ul id="menu"><li id="item">Menu item</li></ul>
<input id="plain" value="WWWWWW">
<input id="secret" type="password" value="WWWWWW">
<div id="closed"></div>
<button type="button" class="copy hidden">Hidden copy</button>
<button type="button" class="copy">Shown copy</button>
<button type="button" class="only hidden">Hidden only</button>
<dialog id="dialog"><p id="in-dialog">In the dialog</p></dialog>
<script>
	document.getElementById("closed").attachShadow({ mode: "closed" }).innerHTML =
		`<input type="password" value="WWWWWW" style="border: 0; font: 700 48px monospace; color: rgb(200, 0, 160)">`;
	window.heard = { pointerdown: 0, click: 0, keydown: 0 };
	for (const type of Object.keys(heard))
		document.addEventListener(type, () => heard[type]++);
	window.trapFocus = () =>
		document.addEventListener("focusin", (e) => {
			if (e.target !== document.getElementById("plain"))
				document.getElementById("plain").focus();
		});
</script>
</body>
</html>
