name: Publish to Chrome Web Store

# Publishes the store zip of a GitHub release to the Chrome Web Store by hand:
# the same job release.yml runs after it creates the release, for a release
# whose publish failed or was rejected. Actions → Publish to Chrome Web Store →
# Run workflow, and pick the release's tag under "Use workflow from"; a run
# from a branch fails.
#
# ractive/release-workflows chrome-extension-publish.yml (DEC-032): only a zip
# whose build provenance verifies (signed by release.yml for this tag), as a
# CRX signed with the item's verified-upload key, from the environment
# chrome-web-store. Setup: kb/operations/chrome-web-store.md.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit for review after the upload (otherwise it stays a draft in the dashboard)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    uses: ractive/release-workflows/.github/workflows/chrome-extension-publish.yml@ea1fdf1ab5602ac55fa78f2d10e65d9dc4d5cd24 # v0.6.0
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      asset: sitegloss-{version}-store.zip
      extension-id: ldmcfigcnobhnbaigehcaodheklibeon
      attest-signer-workflow: .github/workflows/release.yml
      signing-key-id: fhagiknobniheomfcadmfdpanogmpmka
      submit: ${{ inputs.submit }}
