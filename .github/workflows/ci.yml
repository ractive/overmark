name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Chrome for Testing, pinned so a Chrome release cannot change a run; bump it
  # on purpose. Branded Chrome ignores --load-extension, so the extension tests
  # need Chrome for Testing.
  CHROME_VERSION: "156.0.8078.80"
  # Firefox and ff-rdp for the Firefox end-to-end tests (test/e2e/firefox/),
  # pinned the same way: Firefox from Mozilla's release archive, checked
  # against its SHA256SUMS line; ff-rdp from its GitHub release, checked
  # against the build attestation its release workflow made. Bump on purpose:
  # FIREFOX_SHA256 is the line for linux-x86_64/en-US/firefox-<version>.tar.xz
  # in https://archive.mozilla.org/pub/firefox/releases/<version>/SHA256SUMS.
  FIREFOX_VERSION: "160.0"
  FIREFOX_SHA256: fde774e9757c8878534c05ec210db592bf6a1b244c57941ffb2e364c04f35fcd
  FF_RDP_VERSION: "0.5.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # gh attestation verify reads ff-rdp's attestation.
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - name: Install Firefox ${{ env.FIREFOX_VERSION }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/firefox.tar.xz" \
            "https://archive.mozilla.org/pub/firefox/releases/${FIREFOX_VERSION}/linux-x86_64/en-US/firefox-${FIREFOX_VERSION}.tar.xz"
          echo "${FIREFOX_SHA256}  $RUNNER_TEMP/firefox.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/firefox/firefox" --version
      - name: Install ff-rdp ${{ env.FF_RDP_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="ff-rdp-v${FF_RDP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "v${FF_RDP_VERSION}" --repo ractive/ff-rdp \
            --pattern "$archive" --dir "$RUNNER_TEMP"
          # Built from that tag of ractive/ff-rdp by the release workflow it
          # calls (ractive/release-workflows), or the job stops here.
          gh attestation verify "$RUNNER_TEMP/$archive" --repo ractive/ff-rdp \
            --signer-repo ractive/release-workflows \
            --source-ref "refs/tags/v${FF_RDP_VERSION}"
          mkdir -p "$RUNNER_TEMP/ff-rdp"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/ff-rdp"
          "$RUNNER_TEMP/ff-rdp/ff-rdp" --version
      - run: bun install --frozen-lockfile
      # The unit tests and both end-to-end suites: Chromium's and Firefox's.
      - run: bun run verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FIREFOX_PATH: ${{ runner.temp }}/firefox/firefox
          FF_RDP_PATH: ${{ runner.temp }}/ff-rdp/ff-rdp
      # The packages of this commit, downloadable from the run's page: the
      # extension with the fixed key for "Load unpacked", the store package,
      # and the Firefox build's package for addons.mozilla.org.
      - run: bun scripts/build.ts --zip
      - run: bun scripts/build.ts --store --zip --outdir dist-store
      - run: bun scripts/build.ts --firefox --store --zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitegloss-unpacked
          path: |
            sitegloss-*.zip
            !sitegloss-*-store.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitegloss-store
          path: |
            sitegloss-*-store.zip
            !sitegloss-firefox-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitegloss-firefox-store
          path: sitegloss-firefox-*-store.zip
          if-no-files-found: error
