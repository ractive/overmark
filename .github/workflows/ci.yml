name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Chrome for Testing, pinned so a Chrome release cannot change a run; bump it
  # on purpose. Branded Chrome ignores --load-extension, so the extension tests
  # need Chrome for Testing.
  CHROME_VERSION: "156.0.8078.80"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun run zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overmark-unpacked
          path: overmark-*.zip
          if-no-files-found: error
