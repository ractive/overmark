name: Release

# Pushing a tag vX.Y.Z (on a commit of main) builds two zips, the unpacked
# extension with the fixed key (for "Load unpacked") and the store package
# without it, and only then creates the GitHub release with both attached. So a
# failed build leaves no empty release, and published releases are never
# changed afterwards (immutable releases work).
#
#   git tag v0.1.0 <merge commit on main> && git push origin v0.1.0
#
# The build job runs third-party code (bun install, the tests, Chrome) with a
# read-only token; only the release job, which runs none, may write.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CHROME_VERSION: "156.0.8078.80"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is a Chrome version on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Chrome takes 1 to 4 dot-separated integers from 0 to 65535, no leading zeros.
          if ! echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}$' \
            || ! echo "${TAG#v}" | awk -F. '{ for (i = 1; i <= NF; i++) if ($i > 65535) exit 1 }'; then
            echo "tag $TAG is not v plus a Chrome extension version"
            exit 1
          fi
          # An annotated tag's GITHUB_SHA is the tag object: peel it to its commit.
          git merge-base --is-ancestor "$(git rev-parse "$GITHUB_SHA^{commit}")" origin/main \
            || { echo "tag $TAG is not on main"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$TAG" = "v$version" || { echo "tag $TAG, package.json $version"; exit 1; }
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun scripts/build.ts --zip
      - run: bun scripts/build.ts --store --zip --outdir dist-store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zips
          path: overmark-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zips
      - name: Create the release with both zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls overmark-*.zip
          gh release create "$TAG" overmark-*.zip --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Overmark ${TAG#v}" --generate-notes
