name: Release

# A published GitHub release (tag vX.Y.Z on main) gets two zips: the unpacked
# extension with the fixed key (for "Load unpacked") and the store package
# without it.

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CHROME_VERSION: "156.0.8078.80"

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: The tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$TAG" = "v$version" || { echo "tag $TAG, package.json $version"; exit 1; }
      - run: bun scripts/build.ts --zip
      - run: bun scripts/build.ts --store --zip --outdir dist-store
      - name: Attach the zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" overmark-*.zip --clobber
