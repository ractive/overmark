<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Overmark</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<!-- Chrome names the panel and shows the icon above it: no brand here. -->
		<header id="bar">
			<h1 class="visually-hidden">Overmark</h1>
			<button id="ai-button" type="button" class="ai-pill">
				<span id="ai-status">Not connected</span>
				<span id="ai-action" class="ai-action">Connect</span>
			</button>
			<button id="stop-ai" type="button" hidden>Stop AI access</button>
			<p id="ai-call" class="meta" hidden></p>
		</header>
		<!-- The AI connection lives in the service worker; these show it (ai.ts). -->
		<div id="questions" class="ai-box" aria-live="polite"></div>
		<section id="pairing" class="ai-box" aria-labelledby="pairing-heading" hidden>
			<h2 id="pairing-heading">AI connection</h2>
			<div id="pair-replaced" class="hint" hidden>
				<p id="pair-replaced-text"></p>
				<div class="row">
					<button id="pair-take-back" type="button">Connect again</button>
				</div>
			</div>
			<p id="pair-problem" class="hint" hidden></p>
			<div id="pair-address-box">
				<p class="meta">
					Add this address to your AI app as an MCP server, for example
					<code>claude mcp add --transport http overmark &lt;address&gt;</code>
				</p>
				<div class="row">
					<code id="pair-address" class="address"></code>
					<button id="pair-copy" type="button">Copy</button>
				</div>
				<p class="meta">When the relay's page asks for a code, type this one:</p>
				<p id="pair-code" class="code">––– –––</p>
			</div>
			<h3 class="group-title">Connected apps</h3>
			<ul id="pair-grants" class="grants"></ul>
			<p id="pair-none" class="empty">None yet.</p>
			<div class="row">
				<button id="pair-new-address" type="button">New address</button>
				<button id="pair-close" type="button">Close</button>
			</div>
		</section>
		<main id="home">
			<section aria-labelledby="page-heading">
				<h2 id="page-heading">This tab</h2>
				<p id="page" class="page">…</p>
				<p id="hint" class="hint" hidden></p>
				<button id="annotate" type="button" class="primary wide">Annotate this page</button>
			</section>
			<section aria-labelledby="cases-heading">
				<h2 id="cases-heading">Cases</h2>
				<div id="cases"></div>
				<div class="row import">
					<button id="import" type="button">Import a case…</button>
					<input id="import-file" type="file" accept=".zip,application/zip" hidden />
				</div>
				<div id="import-error" class="hint" hidden>
					<p id="import-error-text"></p>
					<button id="import-dismiss" type="button">Dismiss</button>
				</div>
			</section>
			<section aria-labelledby="ai-heading">
				<h2 id="ai-heading">AI app</h2>
				<label class="field">
					Relay
					<input id="relay" type="url" spellcheck="false" autocomplete="off" />
				</label>
				<div class="row">
					<button id="connect" type="button">Connect AI app</button>
				</div>
				<label class="check">
					<input id="keep-on" type="checkbox" />
					Keep AI access on
				</label>
			</section>
			<section aria-labelledby="options-heading">
				<h2 id="options-heading">Options</h2>
				<label class="check">
					<input id="blur-forms" type="checkbox" />
					Blur form fields in screenshots
				</label>
				<label class="check">
					<input id="all-sites" type="checkbox" />
					Allow on all sites, without clicking the icon on each tab
				</label>
			</section>
		</main>
		<main id="case-view" hidden></main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
